name: Build APK
run-name: build-${{ inputs.build_id }}
on:
  workflow_dispatch:
    inputs:
      url: { required: true, type: string }
      app_name: { required: true, type: string }
      package_id: { required: true, type: string }
      build_id: { required: true, type: string }
      icon_path: { required: false, type: string }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Generate project
        env:
          APP_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.app_name }}
          APP_PKG: ${{ inputs.package_id }}
          ICON_PATH: ${{ inputs.icon_path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir proj && cd proj
          if [ -n "$ICON_PATH" ]; then
            curl -L --fail               -H "Accept: application/vnd.github.raw+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$ICON_PATH"               -o app-icon.png
            export APP_ICON="$PWD/app-icon.png"
            python3 -m pip install --quiet Pillow
          fi
          cat > gen.py <<'PY'
          
          import os, json
          from xml.sax.saxutils import escape
          url = os.environ["APP_URL"]; name = os.environ["APP_NAME"]; pkg = os.environ["APP_PKG"]
          def w(p, s):
              os.makedirs(os.path.dirname(p) or ".", exist_ok=True)
              open(p, "w").write(s)
          w("settings.gradle", """pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'app'
          include ':app'
          """)
          w("build.gradle", "plugins { id 'com.android.application' version '8.5.2' apply false }\n")
          w("gradle.properties", "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n")
          w("app/build.gradle", """plugins { id 'com.android.application' }
          android {
            namespace '%s'
            compileSdk 34
            defaultConfig { applicationId '%s'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          """ % (pkg, pkg))
          w("app/src/main/res/values/strings.xml", '<resources><string name="app_name">%s</string></resources>\n' % escape(name).replace("'", "\\'"))
          w("app/src/main/res/values/styles.xml", """<resources>
            <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowActionModeOverlay">true</item>
              <item name="android:windowFullscreen">true</item>
              <item name="android:windowBackground">#101512</item>
              <item name="android:statusBarColor">#101512</item>
              <item name="android:navigationBarColor">#101512</item>
              <item name="android:colorAccent">#B7F34A</item>
            </style>
          </resources>
          """)
          icon_source = os.environ.get("APP_ICON")
          if icon_source and os.path.exists(icon_source):
              from PIL import Image
              sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
              with Image.open(icon_source) as source:
                  source = source.convert("RGBA")
                  for density, size in sizes.items():
                      folder = "app/src/main/res/mipmap-" + density
                      os.makedirs(folder, exist_ok=True)
                      source.resize((size, size), Image.Resampling.LANCZOS).save(folder + "/ic_launcher.png")
          w("app/src/main/AndroidManifest.xml", """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="@string/app_name"%s android:usesCleartextTraffic="true"
                android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true"
                  android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          """ % (' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"' if icon_source else ''))
          w("app/src/main/java/" + pkg.replace(".", "/") + "/MainActivity.java", """package %s;
          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          public class MainActivity extends Activity {
            private WebView web;
            private View splash;
            private long splashStartedAt;
            private int dp(int value) {
              return Math.round(value * getResources().getDisplayMetrics().density);
            }
            private TextView splashText(String text, int size, int color) {
              TextView view = new TextView(this);
              view.setText(text);
              view.setTextSize(size);
              view.setTextColor(color);
              view.setGravity(Gravity.CENTER);
              return view;
            }
            private View createSplash() {
              FrameLayout screen = new FrameLayout(this);
              screen.setBackgroundColor(Color.rgb(16, 21, 18));
          
              LinearLayout glass = new LinearLayout(this);
              glass.setOrientation(LinearLayout.VERTICAL);
              glass.setGravity(Gravity.CENTER);
              glass.setPadding(dp(28), dp(30), dp(28), dp(26));
              glass.setElevation(dp(18));
              GradientDrawable panel = new GradientDrawable();
              panel.setShape(GradientDrawable.RECTANGLE);
              panel.setCornerRadius(dp(28));
              panel.setColor(Color.argb(205, 43, 55, 48));
              panel.setStroke(dp(1), Color.argb(105, 255, 255, 255));
              glass.setBackground(panel);
          
              ImageView icon = new ImageView(this);
              android.graphics.drawable.Drawable appIcon = null;
              try { appIcon = getApplicationInfo().loadIcon(getPackageManager()); } catch (Exception ignored) {}
              if (appIcon != null) icon.setImageDrawable(appIcon);
              icon.setScaleType(ImageView.ScaleType.CENTER_CROP);
              GradientDrawable iconFrame = new GradientDrawable();
              iconFrame.setShape(GradientDrawable.RECTANGLE);
              iconFrame.setCornerRadius(dp(22));
              iconFrame.setColor(Color.argb(45, 255, 255, 255));
              icon.setBackground(iconFrame);
              icon.setClipToOutline(true);
              glass.addView(icon, new LinearLayout.LayoutParams(dp(88), dp(88)));
          
              TextView title = splashText(getString(R.string.app_name), 24, Color.WHITE);
              title.setTypeface(android.graphics.Typeface.DEFAULT, android.graphics.Typeface.BOLD);
              LinearLayout.LayoutParams titleParams = new LinearLayout.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
              titleParams.topMargin = dp(18);
              glass.addView(title, titleParams);
          
              ProgressBar progress = new ProgressBar(this, null, android.R.attr.progressBarStyleSmall);
              if (android.os.Build.VERSION.SDK_INT >= 21) progress.getIndeterminateDrawable().setTint(Color.rgb(183, 243, 74));
              LinearLayout.LayoutParams progressParams = new LinearLayout.LayoutParams(dp(30), dp(30));
              progressParams.topMargin = dp(18);
              glass.addView(progress, progressParams);
          
              TextView loading = splashText("Yuklanmoqda…", 13, Color.argb(190, 255, 255, 255));
              LinearLayout.LayoutParams loadingParams = new LinearLayout.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
              loadingParams.topMargin = dp(10);
              glass.addView(loading, loadingParams);
          
              // Near-fullscreen glass panel: fills the screen except a thin margin,
              // so only its border lines show around the edges.
              int margin = dp(14);
              FrameLayout.LayoutParams panelParams = new FrameLayout.LayoutParams(
                  FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT, Gravity.CENTER);
              panelParams.setMargins(margin, margin, margin, margin);
              screen.addView(glass, panelParams);
              return screen;
            }
            private void dismissSplash() {
              if (splash == null) return;
              long wait = Math.max(0, 900 - (System.currentTimeMillis() - splashStartedAt));
              new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                @Override public void run() {
                  if (splash == null) return;
                  final View current = splash;
                  current.animate().alpha(0f).setDuration(320).withEndAction(new Runnable() {
                    @Override public void run() {
                      if (current.getParent() instanceof ViewGroup) ((ViewGroup) current.getParent()).removeView(current);
                      if (splash == current) splash = null;
                    }
                  }).start();
                }
              }, wait);
            }
            private void showImmersive() {
              try {
              if (android.os.Build.VERSION.SDK_INT >= 30) {
                // Newer Android ignores the legacy flags, so use WindowInsetsController
                // to hide the status and navigation bars and draw edge to edge.
                getWindow().setDecorFitsSystemWindows(false);
                WindowInsetsController c = getWindow().getInsetsController();
                if (c != null) {
                  c.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                  c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                }
                if (android.os.Build.VERSION.SDK_INT >= 29) {
                  getWindow().setNavigationBarContrastEnforced(false);
                  getWindow().setStatusBarContrastEnforced(false);
                }
              } else {
                getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                getWindow().getDecorView().setSystemUiVisibility(
                    View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                    | View.SYSTEM_UI_FLAG_FULLSCREEN
                    | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                    | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                    | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                    | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
              }
              } catch (Exception ignored) {}
            }
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              // Let the website reach the screen edges, including camera cutouts.
              if (android.os.Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams params = getWindow().getAttributes();
                params.layoutInDisplayCutoutMode = android.os.Build.VERSION.SDK_INT >= 30
                    ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                    : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(params);
              }
              showImmersive();
              web = new WebView(this);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true);
              s.setLoadWithOverviewMode(true); s.setUseWideViewPort(true); s.setMediaPlaybackRequiresUserGesture(false);
              web.setWebViewClient(new WebViewClient() {
                @Override public void onPageFinished(WebView view, String loadedUrl) {
                  super.onPageFinished(view, loadedUrl);
                  dismissSplash();
                }
                @Override public void onReceivedError(WebView view, int errorCode, String description, String failingUrl) {
                  super.onReceivedError(view, errorCode, description, failingUrl);
                  dismissSplash();
                }
              });
              web.setWebChromeClient(new WebChromeClient());
              FrameLayout root = new FrameLayout(this);
              root.addView(web, new FrameLayout.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              splashStartedAt = System.currentTimeMillis();
              splash = createSplash();
              root.addView(splash, new FrameLayout.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              setContentView(root);
              if (b == null || web.restoreState(b) == null) web.loadUrl(%s);
            }
            @Override public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) showImmersive();
            }
            @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }
            @Override public void onBackPressed() { if (web.canGoBack()) web.goBack(); else super.onBackPressed(); }
          }
          """ % (pkg, json.dumps(url)))
          
          PY
          python3 gen.py
      - name: Build
        working-directory: proj
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../app.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.build_id }}
          name: ${{ inputs.app_name }}
          body: ${{ inputs.url }}
          files: app.apk
