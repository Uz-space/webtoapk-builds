name: Build APK
run-name: build-${{ inputs.build_id }}
on:
  workflow_dispatch:
    inputs:
      url: { required: true, type: string }
      app_name: { required: true, type: string }
      package_id: { required: true, type: string }
      build_id: { required: true, type: string }
      icon_path: { required: false, type: string }
      html_path: { required: false, type: string }
      full_perms: { required: false, type: string }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Generate project
        env:
          APP_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.app_name }}
          APP_PKG: ${{ inputs.package_id }}
          ICON_PATH: ${{ inputs.icon_path }}
          HTML_PATH: ${{ inputs.html_path }}
          APP_PERMS: ${{ inputs.full_perms }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir proj && cd proj
          if [ -n "$ICON_PATH" ]; then
            curl -L --fail               -H "Accept: application/vnd.github.raw+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$ICON_PATH"               -o app-icon.png
            export APP_ICON="$PWD/app-icon.png"
            python3 -m pip install --quiet Pillow
          fi
          if [ -n "$HTML_PATH" ]; then
            curl -L --fail               -H "Accept: application/vnd.github.raw+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$HTML_PATH"               -o site.html
            export APP_HTML="$PWD/site.html"
          fi
          cat > gen.py <<'PY'
          
          import os, json
          from xml.sax.saxutils import escape
          url = os.environ["APP_URL"]; name = os.environ["APP_NAME"]; pkg = os.environ["APP_PKG"]
          html_source = os.environ.get("APP_HTML")
          if html_source and os.path.exists(html_source):
              os.makedirs("app/src/main/assets", exist_ok=True)
              open("app/src/main/assets/index.html", "wb").write(open(html_source, "rb").read())
              url = "file:///android_asset/index.html"
          def w(p, s):
              os.makedirs(os.path.dirname(p) or ".", exist_ok=True)
              open(p, "w").write(s)
          w("settings.gradle", """pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'app'
          include ':app'
          """)
          w("build.gradle", "plugins { id 'com.android.application' version '8.5.2' apply false }\n")
          w("gradle.properties", "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n")
          w("app/build.gradle", """plugins { id 'com.android.application' }
          android {
            namespace '%s'
            compileSdk 34
            defaultConfig { applicationId '%s'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          """ % (pkg, pkg))
          w("app/src/main/res/values/strings.xml", '<resources><string name="app_name">%s</string></resources>\n' % escape(name).replace("'", "\\'"))
          w("app/src/main/res/values/styles.xml", """<resources>
            <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowActionModeOverlay">true</item>
              <item name="android:windowFullscreen">true</item>
              <item name="android:windowBackground">#101512</item>
              <item name="android:statusBarColor">#101512</item>
              <item name="android:navigationBarColor">#101512</item>
              <item name="android:colorAccent">#B7F34A</item>
            </style>
          </resources>
          """)
          icon_source = os.environ.get("APP_ICON")
          if icon_source and os.path.exists(icon_source):
              from PIL import Image
              sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
              with Image.open(icon_source) as source:
                  source = source.convert("RGBA")
                  for density, size in sizes.items():
                      folder = "app/src/main/res/mipmap-" + density
                      os.makedirs(folder, exist_ok=True)
                      source.resize((size, size), Image.Resampling.LANCZOS).save(folder + "/ic_launcher.png")
          EXTRA_PERMS = """CAMERA RECORD_AUDIO ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION ACCESS_BACKGROUND_LOCATION
          READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO
          POST_NOTIFICATIONS VIBRATE WAKE_LOCK FLASHLIGHT
          READ_CONTACTS WRITE_CONTACTS GET_ACCOUNTS READ_CALENDAR WRITE_CALENDAR
          CALL_PHONE READ_PHONE_STATE READ_PHONE_NUMBERS READ_CALL_LOG ANSWER_PHONE_CALLS
          SEND_SMS READ_SMS RECEIVE_SMS
          BODY_SENSORS ACTIVITY_RECOGNITION HIGH_SAMPLING_RATE_SENSORS
          BLUETOOTH BLUETOOTH_ADMIN BLUETOOTH_CONNECT BLUETOOTH_SCAN NFC
          ACCESS_NETWORK_STATE ACCESS_WIFI_STATE CHANGE_WIFI_STATE INTERNET
          MODIFY_AUDIO_SETTINGS RECEIVE_BOOT_COMPLETED FOREGROUND_SERVICE REQUEST_INSTALL_PACKAGES""".split()
          perm_lines = ""
          if os.environ.get("APP_PERMS"):
              seen = []
              for p in EXTRA_PERMS:
                  if p not in seen and p != "INTERNET":
                      seen.append(p)
              perm_lines = "".join('  <uses-permission android:name="android.permission.%s" tools:ignore="ScopedStorage"/>\n' % p for p in seen)
              perm_lines += '  <uses-feature android:name="android.hardware.camera" android:required="false"/>\n'
          w("app/src/main/AndroidManifest.xml", """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
            <uses-permission android:name="android.permission.INTERNET"/>
          %s  <application android:label="@string/app_name"%s android:usesCleartextTraffic="true"
                android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true"
                  android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          """ % (perm_lines, ' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"' if icon_source else ''))
          w("app/src/main/java/" + pkg.replace(".", "/") + "/MainActivity.java", """package %s;
          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.PermissionRequest;
          import android.webkit.GeolocationPermissions;
          import android.webkit.ValueCallback;
          import android.webkit.JavascriptInterface;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Vibrator;
          import android.hardware.camera2.CameraManager;
          import android.provider.CalendarContract;
          import android.provider.CallLog;
          import android.provider.ContactsContract;
          import android.provider.Settings;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.widget.Toast;
          import org.json.JSONObject;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          public class MainActivity extends Activity {
            private ValueCallback<Uri[]> fileCb;
            private void js(final String code) {
              runOnUiThread(new Runnable() { @Override public void run() { if (web != null) web.evaluateJavascript(code, null); } });
            }
            @Override protected void onActivityResult(int req, int res, Intent data) {
              super.onActivityResult(req, res, data);
              if (req == 77 && fileCb != null) {
                fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                fileCb = null;
              }
            }
            @Override public void onRequestPermissionsResult(int req, String[] perms, int[] results) {
              super.onRequestPermissionsResult(req, perms, results);
              for (int i = 0; i < perms.length; i++) {
                js("window.onAndroidPerm&&window.onAndroidPerm(" + JSONObject.quote(perms[i]) + "," + (results[i] == PackageManager.PERMISSION_GRANTED) + ")");
              }
            }
            // Native bridge used by the "Android ruxsatlari" template; harmless elsewhere.
            class PermBridge {
              @JavascriptInterface public int sdk() { return Build.VERSION.SDK_INT; }
              @JavascriptInterface public String device() { return Build.MANUFACTURER + " " + Build.MODEL + " (Android " + Build.VERSION.RELEASE + ")"; }
              @JavascriptInterface public boolean has(String p) {
                if (Build.VERSION.SDK_INT < 23) return true;
                return checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED;
              }
              @JavascriptInterface public void request(final String p) {
                if (Build.VERSION.SDK_INT < 23) { js("window.onAndroidPerm&&window.onAndroidPerm(" + JSONObject.quote(p) + ",true)"); return; }
                runOnUiThread(new Runnable() { @Override public void run() { requestPermissions(new String[]{p}, 5); } });
              }
              @JavascriptInterface public void vibrate(int ms) {
                try { Vibrator v = (Vibrator) getSystemService(VIBRATOR_SERVICE); if (v != null) v.vibrate(ms); } catch (Exception ignored) {}
              }
              @JavascriptInterface public void toast(final String t) {
                runOnUiThread(new Runnable() { @Override public void run() { Toast.makeText(MainActivity.this, t, Toast.LENGTH_SHORT).show(); } });
              }
              @JavascriptInterface public String torch(boolean on) {
                try {
                  if (Build.VERSION.SDK_INT < 23) return "Android 6+ kerak";
                  CameraManager cm = (CameraManager) getSystemService(CAMERA_SERVICE);
                  cm.setTorchMode(cm.getCameraIdList()[0], on);
                  return "ok";
                } catch (Exception e) { return e.getMessage(); }
              }
              @JavascriptInterface public String count(String kind) {
                try {
                  Uri u = kind.equals("contacts") ? ContactsContract.Contacts.CONTENT_URI
                    : kind.equals("calls") ? CallLog.Calls.CONTENT_URI
                    : kind.equals("calendar") ? CalendarContract.Events.CONTENT_URI
                    : Uri.parse("content://sms/inbox");
                  Cursor c = getContentResolver().query(u, null, null, null, null);
                  if (c == null) return "0";
                  int n = c.getCount(); c.close();
                  return String.valueOf(n);
                } catch (Exception e) { return "Xato: " + e.getMessage(); }
              }
              @JavascriptInterface public void call(String num) {
                try { startActivity(new Intent(Intent.ACTION_CALL, Uri.parse("tel:" + num))); } catch (Exception e) { toast(e.getMessage()); }
              }
              @JavascriptInterface public void notif(String title, String text) {
                try {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  Notification.Builder nb;
                  if (Build.VERSION.SDK_INT >= 26) {
                    nm.createNotificationChannel(new NotificationChannel("main", "Asosiy", NotificationManager.IMPORTANCE_HIGH));
                    nb = new Notification.Builder(MainActivity.this, "main");
                  } else nb = new Notification.Builder(MainActivity.this);
                  nm.notify(1, nb.setSmallIcon(android.R.drawable.ic_dialog_info).setContentTitle(title).setContentText(text).setAutoCancel(true).build());
                } catch (Exception e) { toast(e.getMessage()); }
              }
              @JavascriptInterface public void settings(String action) {
                try {
                  Intent i = new Intent(action);
                  if (!action.equals(Settings.ACTION_SETTINGS) && !action.equals(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                    i.setData(Uri.parse("package:" + getPackageName()));
                  startActivity(i);
                } catch (Exception e) {
                  try { startActivity(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getPackageName()))); } catch (Exception ignored) {}
                }
              }
            }
            private WebView web;
            private View splash;
            private long splashStartedAt;
            private int dp(int value) {
              return Math.round(value * getResources().getDisplayMetrics().density);
            }
            private TextView splashText(String text, int size, int color) {
              TextView view = new TextView(this);
              view.setText(text);
              view.setTextSize(size);
              view.setTextColor(color);
              view.setGravity(Gravity.CENTER);
              return view;
            }
            private View createSplash() {
              FrameLayout screen = new FrameLayout(this);
              screen.setBackgroundColor(Color.BLACK);
              ImageView icon = new ImageView(this);
              android.graphics.drawable.Drawable appIcon = null;
              try { appIcon = getApplicationInfo().loadIcon(getPackageManager()); } catch (Exception ignored) {}
              if (appIcon != null) icon.setImageDrawable(appIcon);
              icon.setScaleType(ImageView.ScaleType.FIT_CENTER);
              FrameLayout.LayoutParams iconParams = new FrameLayout.LayoutParams(dp(144), dp(144), Gravity.CENTER);
              screen.addView(icon, iconParams);
              return screen;
            }
            private void dismissSplash() {
              if (splash == null) return;
              long wait = Math.max(0, 900 - (System.currentTimeMillis() - splashStartedAt));
              new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                @Override public void run() {
                  if (splash == null) return;
                  final View current = splash;
                  current.animate().alpha(0f).setDuration(320).withEndAction(new Runnable() {
                    @Override public void run() {
                      if (current.getParent() instanceof ViewGroup) ((ViewGroup) current.getParent()).removeView(current);
                      if (splash == current) splash = null;
                    }
                  }).start();
                }
              }, wait);
            }
            private void showImmersive() {
              try {
              if (android.os.Build.VERSION.SDK_INT >= 30) {
                // Newer Android ignores the legacy flags, so use WindowInsetsController
                // to hide the status and navigation bars and draw edge to edge.
                getWindow().setDecorFitsSystemWindows(false);
                WindowInsetsController c = getWindow().getInsetsController();
                if (c != null) {
                  c.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                  c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                }
                if (android.os.Build.VERSION.SDK_INT >= 29) {
                  getWindow().setNavigationBarContrastEnforced(false);
                  getWindow().setStatusBarContrastEnforced(false);
                }
              } else {
                getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                getWindow().getDecorView().setSystemUiVisibility(
                    View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                    | View.SYSTEM_UI_FLAG_FULLSCREEN
                    | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                    | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                    | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                    | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
              }
              } catch (Exception ignored) {}
            }
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              // Let the website reach the screen edges, including camera cutouts.
              if (android.os.Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams params = getWindow().getAttributes();
                params.layoutInDisplayCutoutMode = android.os.Build.VERSION.SDK_INT >= 30
                    ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                    : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(params);
              }
              showImmersive();
              web = new WebView(this);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true);
              s.setLoadWithOverviewMode(true); s.setUseWideViewPort(true); s.setMediaPlaybackRequiresUserGesture(false);
              web.setWebViewClient(new WebViewClient() {
                @Override public void onPageFinished(WebView view, String loadedUrl) {
                  super.onPageFinished(view, loadedUrl);
                  dismissSplash();
                }
                @Override public void onReceivedError(WebView view, int errorCode, String description, String failingUrl) {
                  super.onReceivedError(view, errorCode, description, failingUrl);
                  dismissSplash();
                }
              });
              web.addJavascriptInterface(new PermBridge(), "AndroidPerm");
              web.setWebChromeClient(new WebChromeClient() {
                @Override public void onPermissionRequest(final PermissionRequest request) {
                  runOnUiThread(new Runnable() { @Override public void run() { request.grant(request.getResources()); } });
                }
                @Override public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                  callback.invoke(origin, true, false);
                }
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams params) {
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  try { startActivityForResult(params.createIntent(), 77); } catch (Exception e) { fileCb = null; return false; }
                  return true;
                }
              });
              FrameLayout root = new FrameLayout(this);
              root.addView(web, new FrameLayout.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              // Android 12+ already displays the system splash screen. Add our matching
              // fallback only on older versions so users never see two splash screens.
              if (android.os.Build.VERSION.SDK_INT < 31) {
                splashStartedAt = System.currentTimeMillis();
                splash = createSplash();
                root.addView(splash, new FrameLayout.LayoutParams(
                    ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              }
              setContentView(root);
              if (b == null || web.restoreState(b) == null) web.loadUrl(%s);
            }
            @Override public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) showImmersive();
            }
            @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }
            @Override public void onBackPressed() { if (web.canGoBack()) web.goBack(); else super.onBackPressed(); }
          }
          """ % (pkg, json.dumps(url)))
          
          PY
          python3 gen.py
      - name: Build
        working-directory: proj
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../app.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.build_id }}
          name: ${{ inputs.app_name }}
          body: ${{ inputs.url }}
          files: app.apk
