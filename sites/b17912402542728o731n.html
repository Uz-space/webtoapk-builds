<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bildirishnoma</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0e1210;color:#eef3ea;font-family:system-ui,-apple-system,Roboto,sans-serif}
body{display:flex;flex-direction:column;padding:max(24px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}
h1{font-size:22px;font-weight:700;margin-bottom:18px}
label{display:block;font-size:13px;color:#93a08f;margin:14px 0 6px}
input,select{width:100%;padding:14px;border-radius:14px;border:1px solid #2a332c;background:#171d19;color:#eef3ea;font-size:18px;outline:none}
input:focus,select:focus{border-color:#b7f34a}
.out{margin-top:22px;padding:20px;border-radius:18px;background:#171d19;border:1px solid #2a332c}
.out small{color:#93a08f;font-size:13px}.out b{display:block;font-size:30px;color:#b7f34a;margin-top:4px;word-break:break-all}
.row{display:flex;gap:10px}.row>*{flex:1}
button{width:100%;margin-top:22px;padding:16px;border:0;border-radius:16px;background:#b7f34a;color:#0e1210;font-size:17px;font-weight:700}
#m{margin-top:14px;font-size:14px;color:#93a08f;text-align:center}
</style></head><body><h1>Bildirishnoma yuborish</h1>
<label>Sarlavha</label><input id="t" value="Salom!">
<label>Matn</label><input id="x" value="Bu mening ilovamdan bildirishnoma.">
<button id="b">Yuborish</button><div id="m"></div><script>var B=window.AndroidPerm||null,P="android.permission.POST_NOTIFICATIONS",m=document.getElementById("m");
function send(){B.notif(document.getElementById("t").value||"Bildirishnoma",document.getElementById("x").value||"");m.textContent="Yuborildi ✓"}
window.onAndroidPerm=function(p,ok){if(p===P){if(ok)send();else m.textContent="Ruxsat berilmadi. Sozlamalardan yoqing."}};
document.getElementById("b").onclick=function(){
  if(!B){m.textContent="Faqat APK ichida ishlaydi.";return}
  if(B.sdk()>=33&&!B.has(P)){m.textContent="Ruxsat so'ralmoqda…";B.request(P);return}
  send()};</script></body></html>
