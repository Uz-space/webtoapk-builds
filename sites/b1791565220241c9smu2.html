<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>HTML Widget</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0d12;color:#e9eef6;font-family:system-ui,-apple-system,Roboto,sans-serif}
body{display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:12px}
h1{font-size:21px;font-weight:700}h1 span{color:#7cf0c0}
.sub{font-size:12px;color:#7b8a9c}
.card{background:#121821;border:1px solid #1f2b38;border-radius:18px;padding:14px}
label{display:block;font-size:12px;color:#7b8a9c;margin:10px 0 5px}
input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #1f2b38;background:#0a0d12;color:#e9eef6;font-size:15px;outline:none;font-family:inherit}
textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.45;resize:vertical}
input:focus,textarea:focus{border-color:#7cf0c0}
button{border:0;border-radius:12px;font-weight:700;cursor:pointer;font-family:inherit}
#save{width:100%;margin-top:12px;padding:14px;background:#7cf0c0;color:#06120d;font-size:16px}
#save.editing{background:#ffc247}
.rng{display:flex;align-items:center;gap:10px}
.rng input[type=range]{flex:1;padding:0;accent-color:#7cf0c0;background:none;border:0}
.rng b{font-size:13px;color:#7cf0c0;min-width:62px;text-align:right}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:6px}
.w{background:#121821;border:1px solid #1f2b38;border-radius:18px;overflow:hidden}
.w .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #1f2b38}
.w .hd .nm{flex:1;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w .hd button{padding:7px 10px;font-size:13px;background:#1b2531;color:#e9eef6}
.w .hd button.del{color:#ff6b6b}
.frame{position:relative;background:#fff}
.frame iframe{display:block;width:100%;height:100%;border:0}
.grip{position:absolute;right:0;bottom:0;width:34px;height:34px;background:linear-gradient(135deg,transparent 48%,#7cf0c0 48%,#7cf0c0 58%,transparent 58%,transparent 70%,#7cf0c0 70%,#7cf0c0 80%,transparent 80%);cursor:nwse-resize;touch-action:none}
.sz{padding:7px 12px;font-size:11px;color:#7b8a9c;border-top:1px solid #1f2b38}
#empty{color:#7b8a9c;text-align:center;font-size:14px;padding:22px 0}
#tog{width:100%;padding:12px;background:#1b2531;color:#e9eef6;font-size:14px}
.pin{display:block;width:100%;border-radius:0;padding:12px;background:#143a2c;color:#7cf0c0;font-size:14px;border-top:1px solid #1f2b38}
</style></head><body>
<h1>HTML <span>Widget</span></h1>
<div class="sub">HTML kodini joylang — hajmi o'zgaradigan widget tayyor bo'ladi.</div>
<button id="tog">+ Yangi widget</button>
<div class="card" id="form" style="display:none">
  <label>Widget nomi</label>
  <input id="nm" placeholder="Masalan: Soat" maxlength="40">
  <label>HTML kodi</label>
  <textarea id="code" placeholder="&lt;h2&gt;Salom&lt;/h2&gt;"></textarea>
  <label>Balandligi</label>
  <div class="rng"><input id="hh" type="range" min="80" max="600" step="10" value="180"><b id="hv">180 px</b></div>
  <label>Kengligi</label>
  <div class="rng"><input id="ww" type="range" min="30" max="100" step="5" value="100"><b id="wv">100 %</b></div>
  <button id="save">Widget yaratish</button>
</div>
<div id="list"></div>
<div id="empty">Hali widget yo'q. Yuqoridagi tugmani bosing.</div>
<script>
var K="htmlwidgets_v1",items=[],edit=null;
var HOST=window.WidgetHost||null;
var $=function(i){return document.getElementById(i)};
if(HOST){try{items=JSON.parse(HOST.list())||[]}catch(e){items=[]}}
if(!items.length){try{items=JSON.parse(localStorage.getItem(K))||[]}catch(e){items=[]}}
function uid(){return "w"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
items.forEach(function(it){if(!it.id)it.id=uid()});
function store(){
  try{localStorage.setItem(K,JSON.stringify(items))}catch(e){}
  if(HOST){try{HOST.save(JSON.stringify(items))}catch(e){}}
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function doc(h){return '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;padding:10px;font-family:system-ui,-apple-system,Roboto,sans-serif;background:#fff;color:#111}</style>'+h}
function render(){
  var L=$("list");L.innerHTML="";
  $("empty").style.display=items.length?"none":"block";
  items.forEach(function(it,i){
    var d=document.createElement("div");d.className="w";
    d.innerHTML='<div class="hd"><div class="nm">'+esc(it.name)+'</div>'
      +'<button data-a="e" data-i="'+i+'">Tahrir</button>'
      +'<button class="del" data-a="d" data-i="'+i+'">O\u2715</button></div>'
      +'<div class="frame" style="height:'+it.h+'px;width:'+it.w+'%"><iframe sandbox="allow-scripts" srcdoc="'+esc(doc(it.html)).replace(/"/g,"&quot;")+'"></iframe>'
      +'<div class="grip" data-i="'+i+'"></div></div>'
      +(HOST?'<button class="pin" data-a="p" data-i="'+i+'">\ud83d\udcccBosh ekranga qo\u2018shish</button>':'')
      +'<div class="sz">'+it.w+'% \u00d7 '+it.h+' px \u2014 burchakdan tortib hajmini o\u2018zgartiring</div>';
    L.appendChild(d);
  });
}
function openForm(it){
  $("form").style.display="block";
  $("nm").value=it?it.name:"";$("code").value=it?it.html:"";
  $("hh").value=it?it.h:180;$("ww").value=it?it.w:100;sync();
  $("save").textContent=it?"Saqlash":"Widget yaratish";
  $("save").className=it?"editing":"";
  $("tog").textContent=it?"Bekor qilish":"\u2715 Yopish";
}
function closeForm(){edit=null;$("form").style.display="none";$("tog").textContent="+ Yangi widget"}
function sync(){$("hv").textContent=$("hh").value+" px";$("wv").textContent=$("ww").value+" %"}
$("hh").oninput=sync;$("ww").oninput=sync;
$("tog").onclick=function(){ if($("form").style.display=="block"){closeForm()} else {edit=null;openForm(null)} };
$("save").onclick=function(){
  var h=$("code").value.trim();if(!h){alert("HTML kodini kiriting");return}
  var o={name:$("nm").value.trim()||"Widget",html:h,h:+$("hh").value,w:+$("ww").value,id:edit!==null&&items[edit]?items[edit].id:uid()};
  if(edit!==null)items[edit]=o;else items.unshift(o);
  store();closeForm();render();
};
$("list").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var i=+b.getAttribute("data-i"),a=b.getAttribute("data-a");
  if(a=="d"){if(confirm("O\u2018chirilsinmi?")){items.splice(i,1);store();render()}}
  else if(a=="p"){if(HOST){try{HOST.pin(items[i].id)}catch(e){alert("Xato: "+e.message)}}}
  else{edit=i;openForm(items[i]);window.scrollTo(0,0)}
});
var drag=null;
$("list").addEventListener("pointerdown",function(e){
  var g=e.target.closest(".grip");if(!g)return;
  var i=+g.getAttribute("data-i"),f=g.parentNode;
  drag={i:i,f:f,x:e.clientX,y:e.clientY,h:items[i].h,w:items[i].w,pw:f.parentNode.clientWidth};
  g.setPointerCapture(e.pointerId);e.preventDefault();
},{passive:false});
$("list").addEventListener("pointermove",function(e){
  if(!drag)return;
  var h=Math.max(80,Math.min(900,Math.round(drag.h+(e.clientY-drag.y))));
  var w=Math.max(30,Math.min(100,Math.round(drag.w+(e.clientX-drag.x)/drag.pw*100)));
  drag.nh=h;drag.nw=w;drag.f.style.height=h+"px";drag.f.style.width=w+"%";
  drag.f.parentNode.querySelector(".sz").textContent=w+"% \u00d7 "+h+" px \u2014 burchakdan tortib hajmini o\u2018zgartiring";
});
function endDrag(){if(!drag)return;if(drag.nh){items[drag.i].h=drag.nh;items[drag.i].w=drag.nw;store()}drag=null}
$("list").addEventListener("pointerup",endDrag);
$("list").addEventListener("pointercancel",endDrag);
if(!items.length)items=[{name:"Namuna soat",html:'<h2 id="t" style="font:600 34px system-ui;text-align:center;margin-top:18px"></h2><script>setInterval(function(){document.getElementById("t").textContent=new Date().toLocaleTimeString()},500)<\/script>',h:120,w:100}],store();
render();
</script></body></html>
