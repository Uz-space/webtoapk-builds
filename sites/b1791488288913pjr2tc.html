<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claimer Pro Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        :root {
            --accent-hue: 0;
            --accent-sat: 50%;
            --accent-light: 25%;
            --accent-color: hsl(var(--accent-hue), var(--accent-sat), var(--accent-light));
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--accent-color);
            color: #ffffff;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        .bg-solid {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            background-color: var(--accent-color);
            pointer-events: none;
            transition: background-color 0.3s ease;
        }

        .app-root {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .view-section {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            flex-grow: 1;
            overflow: hidden;
        }

        .hidden {
            display: none !important;
        }

        .table-wrapper {
            background: transparent;
            border: none;
            padding: 2px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            overflow-y: auto;
            gap: 10px;
        }

        .table-wrapper::-webkit-scrollbar {
            width: 0px;
        }

        .settings-header, .view-header {
            height: 25px;
            min-height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 2px;
            box-sizing: border-box;
            text-align: center;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #ffffff;
            font-weight: 700;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .interactive-card {
            width: 100%;
            height: 50px;
            min-height: 50px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 25px;
            padding: 0 18px;
            align-items: center;
            box-sizing: border-box;
        }

        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
        }

        .big-card {
            width: 100%;
            min-height: 140px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 25px;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-sizing: border-box;
            position: relative;
        }

        .big-card-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .big-card-title {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .big-card-balance {
            font-weight: 700;
            color: #ffffff;
            font-size: 26px;
            letter-spacing: -0.5px;
            text-align: center;
        }

        .col-1, .col-2, .col-3 {
            text-align: center;
            justify-self: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .row-icon {
            width: 18px;
            height: 18px;
            fill: rgba(255, 255, 255, 0.85);
            flex-shrink: 0;
        }

        .setting-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .account-name, .setting-title {
            font-weight: 500;
            color: #ffffff;
            font-size: 14px;
            letter-spacing: -0.2px;
        }

        .balance-text {
            font-weight: 600;
            color: #ffffff;
            font-size: 14px;
        }

        .timer-text, .setting-value {
            color: rgba(255, 255, 255, 0.85);
            font-variant-numeric: tabular-nums;
            font-size: 13px;
        }

        .color-preview-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: var(--accent-color);
            border: 1px solid #ffffff;
            display: inline-block;
            vertical-align: middle;
            margin-right: 6px;
        }

        .action-chip {
            background: rgba(255, 255, 255, 0.15);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: background 0.2s ease, color 0.2s ease;
            cursor: pointer;
        }

        .action-chip:hover {
            background: #ffffff;
            color: #000000;
        }

        .custom-toggle {
            font-size: 12px;
            position: relative;
            display: inline-block;
            width: 3.5em;
            height: 2em;
            user-select: none;
            flex-shrink: 0;
        }

        .custom-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: hsl(0, 50%, 50%);
            border-radius: 2em;
            transition: background-color 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .toggle-slider::before {
            content: "";
            position: absolute;
            height: 1.5em;
            width: 1.5em;
            border-radius: 50%;
            left: 0.25em;
            bottom: 0.25em;
            background-color: #ffffff;
            transition: transform 0.3s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .custom-toggle input:checked + .toggle-slider {
            background-color: hsl(120, 50%, 50%);
        }

        .custom-toggle input:checked + .toggle-slider::before {
            transform: translateX(1.5em);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #121212;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 24px;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .modal-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            text-align: center;
        }

        .modal-input {
            width: 100%;
            height: 46px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 0 16px;
            color: #ffffff;
            font-size: 14px;
            text-align: center;
        }

        .modal-input:focus {
            border-color: #ffffff;
        }

        .hue-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 14px;
            border-radius: 7px;
            background: linear-gradient(to right, 
                hsl(0, 50%, 25%), hsl(60, 50%, 25%), hsl(120, 50%, 25%), 
                hsl(180, 50%, 25%), hsl(240, 50%, 25%), hsl(300, 50%, 25%), hsl(360, 50%, 25%));
            outline: none;
        }

        .hue-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        .theme-preset-btn-group {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .preset-btn {
            flex: 1;
            height: 36px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .preset-black {
            background: #000000;
            color: #ffffff;
        }

        .preset-white {
            background: #ffffff;
            color: #000000;
        }

        .preset-btn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            height: 38px;
            padding: 0 18px;
            border-radius: 19px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.15);
            color: #cccccc;
        }

        .btn-save {
            background: #ffffff;
            color: #000000;
        }

        .glass-tab-bar {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 12px; 
            padding: 4px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 36px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 2px;
            flex-shrink: 0;
        }

        .active-indicator {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transform: translateX(68px);
            transition: transform 0.35s ease;
            pointer-events: none;
            z-index: 1;
        }

        .tab-item {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 56px;
            height: 56px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            border-radius: 50%;
            transition: color 0.3s ease;
            cursor: pointer;
            z-index: 2;
        }

        .tab-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            transition: transform 0.2s ease;
        }

        .tab-item.active {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="bg-solid"></div>

    <div class="app-root">
        
        <!-- 1. BALANCE VIEW -->
        <div class="view-section hidden" id="balanceView">
            <div class="table-wrapper">
                <div class="view-header">Balance</div>
                <div class="item-list">
                    <div class="big-card">
                        <div class="big-card-top">
                            <svg class="row-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05.97 1.91 2.58 1.91 1.45 0 2.3-.67 2.3-1.67 0-.98-.81-1.41-2.42-1.81-2.02-.49-4.14-1.21-4.14-3.57 0-1.72 1.31-2.93 3.03-3.29V4h2.67v1.93c1.55.33 2.8 1.36 3.01 3h-1.94c-.21-.86-.96-1.51-2.22-1.51-1.18 0-2.05.62-2.05 1.54 0 .93.75 1.35 2.29 1.74 2.16.54 4.27 1.25 4.27 3.65 0 1.81-1.39 3.05-3.19 3.41z"/></svg>
                            <span class="big-card-title">Balans</span>
                        </div>
                        <div class="big-card-balance" id="captchaBalanceDisplay">15.400000</div>
                        <span class="action-chip" id="depositBtn">+ Pul kiritish</span>
                    </div>
                    
                    <div class="interactive-card setting-row">
                        <span class="setting-title">Yechilgan Kapchalar</span>
                        <span class="setting-value">3,420 ta</span>
                    </div>
                    <div class="interactive-card setting-row">
                        <span class="setting-title">Xizmat Holati</span>
                        <span class="setting-value" style="color: hsl(120, 50%, 50%);">Faol</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. DASHBOARD VIEW -->
        <div class="view-section" id="dashboardView">
            <div class="table-wrapper">
                <div class="view-header">Dashboard</div>
                <div class="item-list" id="accountsBody"></div>
            </div>
        </div>

        <!-- 3. SETTINGS VIEW -->
        <div class="view-section hidden" id="settingsView">
            <div class="table-wrapper">
                <div class="settings-header">
                    <span>Settings</span>
                </div>
                <div class="item-list">
                    <div class="interactive-card setting-row">
                        <div class="setting-left">
                            <svg class="row-icon" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1-1.5-1s-1.5.17-1.5 1v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                            <span class="setting-title">Notifications</span>
                        </div>
                        <label class="custom-toggle" onclick="event.stopPropagation()">
                            <input type="checkbox" id="my-toggle">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>

                    <div class="interactive-card setting-row" id="languageSettingRow">
                        <div class="setting-left">
                            <svg class="row-icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95c-.32-1.25-.78-2.45-1.38-3.56 1.84.63 3.37 1.91 4.33 3.56zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2 0 .68.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56-1.84-.63-3.37-1.91-4.33-3.56zm2.95-8H5.08c.96-1.65 2.49-2.93 4.33-3.56C8.81 5.55 8.35 6.75 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2 0-.68.07-1.35.16-2h4.68c.09.65.16 1.32.16 2 0 .68-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95c-.96 1.65-2.49 2.93-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2 0-.68-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>
                            <span class="setting-title">Language</span>
                        </div>
                        <span class="setting-value" id="currentLangDisplay">O'zbekcha</span>
                    </div>

                    <div class="interactive-card setting-row" id="apiSettingRow">
                        <div class="setting-left">
                            <svg class="row-icon" viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
                            <span class="setting-title">API Key</span>
                        </div>
                        <span class="setting-value" id="apiValueDisplay">Not Set</span>
                    </div>

                    <div class="interactive-card setting-row" id="addAccountRow">
                        <div class="setting-left">
                            <svg class="row-icon" viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9 0c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4zm9 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2c0-2.66-5.33-4-8-4z"/></svg>
                            <span class="setting-title">Add Account</span>
                        </div>
                        <span class="action-chip">+ Add</span>
                    </div>

                    <div class="interactive-card setting-row" id="themeSettingRow">
                        <div class="setting-left">
                            <svg class="row-icon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61.43.53.63 1.2.52 1.87-.18 1.09.73 2.02 1.84 2.02h2.17c.83 0 1.5-.67 1.5-1.5 0-.39.15-.75.42-1.02.27-.27.63-.42 1.02-.42h1.06c4.97 0 9-4.03 9-9 0-4.97-4.03-9-9-9zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                            <span class="setting-title">System Theme</span>
                        </div>
                        <span class="setting-value" id="themeValueDisplay">
                            <span class="color-preview-dot"></span><span id="hslLabelText">hsl(0°, 50%, 25%)</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <nav class="glass-tab-bar">
            <div class="active-indicator" id="indicator"></div>

            <a href="javascript:void(0)" class="tab-item" data-target="balanceView">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05.97 1.91 2.58 1.91 1.45 0 2.3-.67 2.3-1.67 0-.98-.81-1.41-2.42-1.81-2.02-.49-4.14-1.21-4.14-3.57 0-1.72 1.31-2.93 3.03-3.29V4h2.67v1.93c1.55.33 2.8 1.36 3.01 3h-1.94c-.21-.86-.96-1.51-2.22-1.51-1.18 0-2.05.62-2.05 1.54 0 .93.75 1.35 2.29 1.74 2.16.54 4.27 1.25 4.27 3.65 0 1.81-1.39 3.05-3.19 3.41z"/></svg>
            </a>
            
            <a href="javascript:void(0)" class="tab-item active" data-target="dashboardView">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>

            <a href="javascript:void(0)" class="tab-item" data-target="settingsView">

            </a>
        </nav>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="apiModal">
        <div class="modal-card">
            <div class="modal-title">API Key Kiriting</div>
            <input type="password" class="modal-input" id="apiKeyInput" placeholder="sk-proj-xxxxxxxxxxxx">
            <div class="modal-actions">
                <button class="btn btn-cancel" id="cancelApiBtn">Bekor qilish</button>
                <button class="btn btn-save" id="saveApiBtn">Saqlash</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="accountModal">
        <div class="modal-card">
            <div class="modal-title">Yangi Akkaunt Qo'shish</div>
            <input type="text" class="modal-input" id="accountNameInput" placeholder="Akkaunt nomi">
            <div class="modal-actions">
                <button class="btn btn-cancel" id="cancelAccBtn">Bekor qilish</button>
                <button class="btn btn-save" id="saveAccBtn">Qo'shish</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="langModal">
        <div class="modal-card">
            <div class="modal-title">Tilni Tanlang</div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <button class="btn btn-cancel lang-opt" data-lang="O'zbekcha" style="text-align: center; width: 100%;">O'zbekcha</button>
                <button class="btn btn-cancel lang-opt" data-lang="English" style="text-align: center; width: 100%;">English</button>
                <button class="btn btn-cancel lang-opt" data-lang="Русский" style="text-align: center; width: 100%;">Русский</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="themeModal">
        <div class="modal-card">
            <div class="modal-title">Tizim Rangini Tanlang</div>
            <input type="range" min="0" max="360" value="0" class="hue-slider" id="hueRange">
            <div style="text-align: center; font-size: 13px; color: #aaaaaa;" id="huePreviewText">
                hsl(0°, 50%, 25%)
            </div>
            
            <div class="theme-preset-btn-group">
                <button class="preset-btn preset-black" id="setBlackBtn">Original Qora</button>
                <button class="preset-btn preset-white" id="setWhiteBtn">Original Oq</button>
            </div>

            <div class="modal-actions">
                <button class="btn btn-cancel" id="cancelThemeBtn">Bekor qilish</button>
                <button class="btn btn-save" id="saveThemeBtn">Tanlash</button>
            </div>
        </div>
    </div>

    <script>
        let accounts = [
            { name: "alphauzs", balance: 342.50, timeLeft: 3600 },
            { name: "trader", balance: 289.00, timeLeft: 1845 },
            { name: "user", balance: 156.20, timeLeft: 220 }
        ];

        let systemActive = true;

        function formatTime(seconds) {
            if (seconds <= 0) return "Ready Now";
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function render() {
            const container = document.getElementById('accountsBody');
            container.innerHTML = '';

            accounts.forEach((acc) => {
                const row = document.createElement('div');
                row.className = 'interactive-card grid-row';
                row.innerHTML = `
                    <div class="col-1"><span class="account-name">${acc.name}</span></div>
                    <div class="col-2"><span class="balance-text">${acc.balance.toFixed(6)}</span></div>
                    <div class="col-3"><span class="timer-text">${formatTime(acc.timeLeft)}</span></div>
                `;
                container.appendChild(row);
            });
        }

        setInterval(() => {
            if (!systemActive) return;
            let updated = false;
            accounts.forEach(acc => {
                if (acc.timeLeft > 0) {
                    acc.timeLeft--;
                    updated = true;
                }
            });
            if (updated) render();
        }, 1000);

        render();

        const tabItems = document.querySelectorAll('.tab-item');
        const indicator = document.getElementById('indicator');
        const views = document.querySelectorAll('.view-section');

        function moveIndicator(targetElement) {
            if (targetElement && indicator) {
                indicator.style.transform = `translateX(${targetElement.offsetLeft - 4}px)`;
            }
        }

        tabItems.forEach((item) => {
            item.addEventListener('click', function() {
                tabItems.forEach(tab => tab.classList.remove('active'));
                this.classList.add('active');
                moveIndicator(this);

                const targetViewId = this.getAttribute('data-target');
                views.forEach(view => {
                    if (view.id === targetViewId) {
                        view.classList.remove('hidden');
                    } else {
                        view.classList.add('hidden');
                    }
                });
            });
        });

        window.addEventListener('load', () => {
            const activeTab = document.querySelector('.tab-item.active');
            const targetViewId = activeTab.getAttribute('data-target');
            views.forEach(view => {
                if (view.id === targetViewId) {
                    view.classList.remove('hidden');
                } else {
                    view.classList.add('hidden');
                }
            });
        });

        window.addEventListener('resize', () => moveIndicator(document.querySelector('.tab-item.active')));

        // Modallar logikasi
        const apiSettingRow = document.getElementById('apiSettingRow');
        const apiModal = document.getElementById('apiModal');
        const cancelApiBtn = document.getElementById('cancelApiBtn');
        const saveApiBtn = document.getElementById('saveApiBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const apiValueDisplay = document.getElementById('apiValueDisplay');

        apiSettingRow.addEventListener('click', () => { apiModal.classList.add('active'); apiKeyInput.focus(); });
        cancelApiBtn.addEventListener('click', () => apiModal.classList.remove('active'));
        saveApiBtn.addEventListener('click', () => {
            const val = apiKeyInput.value.trim();
            apiValueDisplay.textContent = val ? '••••' + val.slice(-4) : 'Not Set';
            apiModal.classList.remove('active');
        });

        const addAccountRow = document.getElementById('addAccountRow');
        const accountModal = document.getElementById('accountModal');
        const cancelAccBtn = document.getElementById('cancelAccBtn');
        const saveAccBtn = document.getElementById('saveAccBtn');
        const accountNameInput = document.getElementById('accountNameInput');

        addAccountRow.addEventListener('click', () => { accountModal.classList.add('active'); accountNameInput.value = ''; accountNameInput.focus(); });
        cancelAccBtn.addEventListener('click', () => accountModal.classList.remove('active'));
        saveAccBtn.addEventListener('click', () => {
            const accName = accountNameInput.value.trim();
            if (accName) { accounts.push({ name: accName, balance: 0, timeLeft: 3600 }); render(); }
            accountModal.classList.remove('active');
        });

        const languageSettingRow = document.getElementById('languageSettingRow');
        const langModal = document.getElementById('langModal');
        const currentLangDisplay = document.getElementById('currentLangDisplay');

        languageSettingRow.addEventListener('click', () => langModal.classList.add('active'));
        document.querySelectorAll('.lang-opt').forEach(opt => {
            opt.addEventListener('click', function() {
                currentLangDisplay.textContent = this.getAttribute('data-lang');
                langModal.classList.remove('active');
            });
        });

        const themeSettingRow = document.getElementById('themeSettingRow');
        const themeModal = document.getElementById('themeModal');
        const hueRange = document.getElementById('hueRange');
        const huePreviewText = document.getElementById('huePreviewText');
        const hslLabelText = document.getElementById('hslLabelText');
        const cancelThemeBtn = document.getElementById('cancelThemeBtn');
        const saveThemeBtn = document.getElementById('saveThemeBtn');
        const setBlackBtn = document.getElementById('setBlackBtn');
        const setWhiteBtn = document.getElementById('setWhiteBtn');

        themeSettingRow.addEventListener('click', () => themeModal.classList.add('active'));
        cancelThemeBtn.addEventListener('click', () => themeModal.classList.remove('active'));

        function applyTheme(h, s, l, label) {
            document.documentElement.style.setProperty('--accent-hue', h);
            document.documentElement.style.setProperty('--accent-sat', s);
            document.documentElement.style.setProperty('--accent-light', l);
            hslLabelText.textContent = label;
        }

        hueRange.addEventListener('input', (e) => {
            const hue = e.target.value;
            huePreviewText.textContent = `hsl(${hue}°, 50%, 25%)`;
            applyTheme(hue, '50%', '25%', `hsl(${hue}°, 50%, 25%)`);
        });

        setBlackBtn.addEventListener('click', () => {
            applyTheme(0, '0%', '0%', 'Original Qora');
            themeModal.classList.remove('active');
        });

        setWhiteBtn.addEventListener('click', () => {
            applyTheme(0, '0%', '100%', 'Original Oq');
            themeModal.classList.remove('active');
        });

        saveThemeBtn.addEventListener('click', () => {
            const hue = hueRange.value;
            applyTheme(hue, '50%', '25%', `hsl(${hue}°, 50%, 25%)`);
            themeModal.classList.remove('active');
        });
    
        // Notification toggle: yoqilganda darhol bildirishnoma
        (function(){
            var B=window.AndroidPerm||null,P="android.permission.POST_NOTIFICATIONS",T=document.getElementById('my-toggle');
            try{T.checked=localStorage.getItem('notifOn')==='1'}catch(e){}
            function send(){
                try{localStorage.setItem('notifOn','1')}catch(e){}
                if(B){B.notif("Bildirishnoma","Bildirishnoma yoqildi");return}
                if(window.Notification&&Notification.permission==="granted")new Notification("Bildirishnoma yoqildi");
                else if(window.Notification&&Notification.permission!=="denied")Notification.requestPermission().then(function(p){if(p==="granted")new Notification("Bildirishnoma yoqildi");else T.checked=false});
            }
            window.onAndroidPerm=function(p,ok){if(p===P){if(ok)send();else{T.checked=false;try{localStorage.setItem('notifOn','0')}catch(e){}}}};
            T.addEventListener('change',function(){
                if(!T.checked){try{localStorage.setItem('notifOn','0')}catch(e){}return}
                if(B&&B.sdk()>=33&&!B.has(P)){B.request(P);return}
                send();
            });
        })();
</script>
</body>
</html>
