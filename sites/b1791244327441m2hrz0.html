<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TronPick Terminal Dashboard</title>
  <style>
    /* STYLES & COLORS (Saturation: 50%, Lightness: 50% | GRAY: 0%) */
    :root {
      --color-cyan: hsl(180, 50%, 50%);
      --color-yellow: hsl(60, 50%, 50%);
      --color-green: hsl(120, 50%, 50%);
      --color-orange: hsl(30, 50%, 50%);
      --color-red: hsl(0, 50%, 50%);
      --color-magenta: hsl(300, 50%, 50%);
      --color-gray: hsl(0, 0%, 50%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 100vh;
    }

    /* Stats Box Styles */
    #stats-box {
      border: 1px solid var(--color-cyan);
      border-radius: 20px; /* 4 tomoni 20px yumaloqlandi */
      background: #000000;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
    }

    .stats-row {
      display: flex;
      width: 100%;
      align-items: center;
    }

    /* Barcha ustunlar 1:1:1 hajmda (teng) */
    .h-account, .v-account,
    .h-balance, .v-balance,
    .h-timer, .v-timer {
      flex: 1 1 0;
      width: 0;
      text-align: center;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
    }

    .h-account, .v-account { color: var(--color-cyan); }
    .h-balance, .v-balance { color: var(--color-yellow); }
    .h-timer, .v-timer { color: var(--color-magenta); }

    .bold {
      font-weight: bold;
    }

    .divider {
      width: 6px;
      flex-shrink: 0;
      color: var(--color-gray);
      font-weight: bold;
      text-align: center;
      font-size: 11px;
    }

    .hline {
      width: 100%;
      height: 1px;
      background-color: var(--color-gray);
      margin: 8px 0;
      opacity: 0.5;
    }

    /* Logs Box Styles */
    #logs-box {
      border: 1px solid var(--color-yellow);
      border-radius: 20px; /* 4 tomoni 20px yumaloqlandi */
      background: #000000;
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #logs-title {
      color: var(--color-yellow);
      font-weight: bold;
      text-align: center;
      margin-bottom: 12px;
      font-size: 14px;
    }

    #logs-content {
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 14px;
    }

    .log-cyan { color: var(--color-cyan); }
    .log-yellow { color: var(--color-yellow); }
    .log-green { color: var(--color-green); }
    .log-orange { color: var(--color-orange); }
    .log-red { color: var(--color-red); }
  </style>
</head>
<body>

  <!-- Stats Box -->
  <div id="stats-box">
    <div class="stats-row">
      <div class="h-account bold">ACCOUNT</div>
      <div class="divider">│</div>
      <div class="h-balance bold">BALANCE</div>
      <div class="divider">│</div>
      <div class="h-timer bold">NEXT CLAIM IN</div>
    </div>

    <div class="hline"></div>

    <div class="stats-row">
      <div class="v-account" id="val-account">alphauzs</div>
      <div class="divider">│</div>
      <div class="v-balance" id="val-balance">0.000000</div>
      <div class="divider">│</div>
      <div class="v-timer" id="val-timer">60:00</div>
    </div>
  </div>

  <!-- Logs Box -->
  <div id="logs-box">
    <div id="logs-title">LIVE LOGS</div>
    <div id="logs-content"></div>
  </div>

  <script>
    let dotStep = 0;
    let timeRemaining = 3600; // 60 daqiqa

    // Taymer mantig'i
    function updateTimer() {
      if (timeRemaining > 0) {
        timeRemaining--;
      } else {
        timeRemaining = 3600;
      }

      const mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
      const secs = (timeRemaining % 60).toString().padStart(2, '0');
      
      document.getElementById("val-timer").innerText = `${mins}:${secs}`;
    }

    // Nuqtalar animatsiyasi mantig'i
    function animateDots() {
      dotStep = (dotStep + 1) % 3;
      let dots = "● ○ ○";
      if (dotStep === 1) {
        dots = "○ ● ○";
      } else if (dotStep === 2) {
        dots = "○ ○ ●";
      }

      const logsHtml = `
<span class="log-cyan">➜ INITIALIZING ${dots}</span>
<span class="log-yellow">➜ CONNECTING ${dots}</span>
<span class="log-green">➜ LOGGED IN</span>
<span class="log-orange">➜ PROCESSING ${dots}</span>
<span class="log-green">➜ SUCCESS</span>
<span class="log-red">➜ ERROR</span>
      `.trim();

      document.getElementById("logs-content").innerHTML = logsHtml;
    }

    // Intervallarni ishga tushirish
    setInterval(animateDots, 250);
    setInterval(updateTimer, 1000);
    
    // Boshlang'ich chaqiruv
    animateDots();
  </script>
</body>
</html>
