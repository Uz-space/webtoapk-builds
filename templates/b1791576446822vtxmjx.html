<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claimer Pro Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        :root {
            --accent-hue: 0;
            --accent-sat: 50%;
            --accent-light: 25%;
            --accent-color: hsl(var(--accent-hue), var(--accent-sat), var(--accent-light));
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--accent-color);
            color: #ffffff;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        .bg-solid {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            background-color: var(--accent-color);
            pointer-events: none;
            transition: background-color 0.3s ease;
        }

        .app-root {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .view-section {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            flex-grow: 1;
            overflow: hidden;
        }

        .hidden {
            display: none !important;
        }

        .table-wrapper {
            background: transparent;
            border: none;
            padding: 2px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            overflow-y: auto;
            gap: 10px;
        }

        .table-wrapper::-webkit-scrollbar {
            width: 0px;
        }

        .settings-header, .view-header {
            height: 25px;
            min-height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 2px;
            box-sizing: border-box;
            text-align: center;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #ffffff;
            font-weight: 700;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .interactive-card {
            width: 100%;
            height: 50px;
            min-height: 50px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 25px;
            padding: 0 18px;
            align-items: center;
            box-sizing: border-box;
        }

        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
        }

        .big-card {
            width: 100%;
            min-height: 140px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 25px;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-sizing: border-box;
            position: relative;
        }

        .big-card-balance {
            font-weight: 700;
            color: #ffffff;
            font-size: 32px;
            letter-spacing: -0.5px;
            text-align: center;
        }

        .col-1, .col-2, .col-3 {
            text-align: center;
            justify-self: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .row-icon {
            width: 18px;
            height: 18px;
            fill: rgba(255, 255, 255, 0.85);
            flex-shrink: 0;
        }

        .setting-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .account-name, .setting-title {
            font-weight: 500;
            color: #ffffff;
            font-size: 14px;
            letter-spacing: -0.2px;
        }

        .balance-text {
            font-weight: 600;
            color: #ffffff;
            font-size: 14px;
        }

        .timer-text, .setting-value {
            color: rgba(255, 255, 255, 0.85);
            font-variant-numeric: tabular-nums;
            font-size: 13px;
        }

        .color-preview-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: var(--accent-color);
            border: 1px solid #ffffff;
            display: inline-block;
            vertical-align: middle;
            margin-right: 6px;
        }

        .custom-toggle {
            font-size: 12px;
            position: relative;
            display: inline-block;
            width: 3.5em;
            height: 2em;
            user-select: none;
            flex-shrink: 0;
        }

        .custom-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: hsl(0, 50%, 50%);
            border-radius: 2em;
            transition: background-color 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .toggle-slider::before {
            content: "";
            position: absolute;
            height: 1.5em;
            width: 1.5em;
            border-radius: 50%;
            left: 0.25em;
            bottom: 0.25em;
            background-color: #ffffff;
            transition: transform 0.3s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .custom-toggle input:checked + .toggle-slider {
            background-color: hsl(120, 50%, 50%);
        }

        .custom-toggle input:checked + .toggle-slider::before {
            transform: translateX(1.5em);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #121212;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 24px;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .modal-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            text-align: center;
        }

        .modal-input {
            width: 100%;
            height: 46px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 0 16px;
            color: #ffffff;
            font-size: 14px;
            text-align: center;
        }

        .modal-input:focus {
            border-color: #ffffff;
        }

        .hue-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 14px;
            border-radius: 7px;
            background: linear-gradient(to right, 
                hsl(0, 50%, 25%), hsl(60, 50%, 25%), hsl(120, 50%, 25%), 
                hsl(180, 50%, 25%), hsl(240, 50%, 25%), hsl(300, 50%, 25%), hsl(360, 50%, 25%));
            outline: none;
        }

        .hue-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        .theme-preset-btn-group {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .preset-btn {
            flex: 1;
            height: 36px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .preset-black {
            background: #000000;
            color: #ffffff;
        }

        .preset-white {
            background: #ffffff;
            color: #000000;
        }

        .preset-btn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            height: 38px;
            padding: 0 18px;
            border-radius: 19px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.15);
            color: #cccccc;
        }

        .btn-save {
            background: #ffffff;
            color: #000000;
        }

        .glass-tab-bar {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 12px; 
            padding: 4px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 36px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 2px;
            flex-shrink: 0;
        }

        .active-indicator {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transform: translateX(68px);
            transition: transform 0.35s ease;
            pointer-events: none;
            z-index: 1;
        }

        .tab-item {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 56px;
            height: 56px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            border-radius: 50%;
            transition: color 0.3s ease;
            cursor: pointer;
            z-index: 2;
        }

        .tab-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            transition: transform 0.2s ease;
        }

        .tab-item.active {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="bg-solid"></div>

    <div class="app-root">

    <div class="modal-overlay" id="apiModal">

            <div class="modal-actions">

                <button class="btn btn-save" id="saveApiBtn" data-i18n="saveBtn">Save</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="accountModal">
        <div class="modal-card">
            <div class="modal-title" data-i18n="modalAccTitle">Add New Account</div>
            <input type="text" class="modal-input" id="accountNameInput" placeholder="Account name">
            <div class="modal-actions">
                <button class="btn btn-cancel" id="cancelAccBtn" data-i18n="cancelBtn">Cancel</button>
                <button class="btn btn-save" id="saveAccBtn" data-i18n="addBtnModal">Add</button>

    <div class="modal-overlay" id="langModal">

                <button class="btn btn-cancel lang-opt" data-lang-code="en" style="text-align: center; width: 100%;">English</button>
                <button class="btn btn-cancel lang-opt" data-lang-code="ru" style="text-align: center; width: 100%;">Русский</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="themeModal">
        <div class="modal-card">
            <div class="modal-title" data-i18n="modalThemeTitle">Select System Color</div>
            <input type="range" min="0" max="360" value="0" class="hue-slider" id="hueRange">
            <div style="text-align: center; font-size: 13px; color: #aaaaaa;" id="huePreviewText">
                hsl(0°, 50%, 25%)
            </div>
            
            <div class="theme-preset-btn-group">
                <button class="preset-btn preset-black" id="setBlackBtn" data-i18n="originalBlack">Original Black</button>
                <button class="preset-btn preset-white" id="setWhiteBtn" data-i18n="originalWhite">Original White</button>
            </div>

            <div class="modal-actions">
                <button class="btn btn-cancel" id="cancelThemeBtn" data-i18n="cancelBtn">Cancel</button>
                <button class="btn btn-save" id="saveThemeBtn" data-i18n="selectBtn">Select</button>
            </div>
        </div>
    </div>

            ru: {
                balanceHeader: "Баланс",

                solvedCount: "3,420 шт",
                serviceStatus: "Статус службы",

                addBtn: "+ Добавить",
                systemTheme: "Тема системы",
                modalApiTitle: "Введите API Ключ",
                modalAccTitle: "Добавить аккаунт",
                modalLangTitle: "Выберите язык",
                modalThemeTitle: "Выберите цвет системы",
                cancelBtn: "Отмена",
                saveBtn: "Сохранить",
                addBtnModal: "Добавить",
                selectBtn: "Выбрать",
                originalBlack: "Оригинальный черный",
                originalWhite: "Оригинальный белый",
                readyNow: "Готово"
            }
        };

        let currentLang = 'en';

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            const langNames = { en: 'English', uz: "O'zbekcha", ru: 'Русский' };
            document.getElementById('currentLangDisplay').textContent = langNames[lang];
            render();
        }

        let accounts = [
            { name: "alphauzs", balance: 342.50, timeLeft: 3600 },
            { name: "trader", balance: 289.00, timeLeft: 1845 },
            { name: "user", balance: 156.20, timeLeft: 220 }
        ];

        let systemActive = true;

        function formatTime(seconds) {
            if (seconds <= 0) return translations[currentLang].readyNow;
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function render() {
            const container = document.getElementById('accountsBody');
            container.innerHTML = '';

            accounts.forEach((acc) => {
                const row = document.createElement('div');
                row.className = 'interactive-card grid-row';
                row.innerHTML = `
                    <div class="col-1"><span class="account-name">${acc.name}</span></div>
                    <div class="col-2"><span class="balance-text">${acc.balance.toFixed(6)}</span></div>
                    <div class="col-3"><span class="timer-text">${formatTime(acc.timeLeft)}</span></div>
                `;
                container.appendChild(row);
            });
        }

        setInterval(() => {
            if (!systemActive) return;
            let updated = false;
            accounts.forEach(acc => {
                if (acc.timeLeft > 0) {
                    acc.timeLeft--;
                    updated = true;
                }
            });
            if (updated) render();
        }, 1000);

        render();

        const tabItems = document.querySelectorAll('.tab-item');
        const indicator = document.getElementById('indicator');
        const views = document.querySelectorAll('.view-section');

        function moveIndicator(targetElement) {
            if (targetElement && indicator) {
                indicator.style.transform = `translateX(${targetElement.offsetLeft - 4}px)`;
            }
        }

        tabItems.forEach((item) => {
            item.addEventListener('click', function() {
                tabItems.forEach(tab => tab.classList.remove('active'));
                this.classList.add('active');
                moveIndicator(this);

                const targetViewId = this.getAttribute('data-target');
                views.forEach(view => {
                    if (view.id === targetViewId) {
                        view.classList.remove('hidden');
                    } else {
                        view.classList.add('hidden');
                    }
                });
            });
        });

        window.addEventListener('load', () => {
            const activeTab = document.querySelector('.tab-item.active');
            const targetViewId = activeTab.getAttribute('data-target');
            views.forEach(view => {
                if (view.id === targetViewId) {
                    view.classList.remove('hidden');
                } else {
                    view.classList.add('hidden');
                }
            });
            setLanguage('en');
        });

        window.addEventListener('resize', () => moveIndicator(document.querySelector('.tab-item.active')));

        const apiSettingRow = document.getElementById('apiSettingRow');
        const apiModal = document.getElementById('apiModal');
        const cancelApiBtn = document.getElementById('cancelApiBtn');
        const saveApiBtn = document.getElementById('saveApiBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const apiValueDisplay = document.getElementById('apiValueDisplay');

        apiSettingRow.addEventListener('click', () => { apiModal.classList.add('active'); apiKeyInput.focus(); });
        cancelApiBtn.addEventListener('click', () => apiModal.classList.remove('active'));
        saveApiBtn.addEventListener('click', () => {
            const val = apiKeyInput.value.trim();
            apiValueDisplay.textContent = val ? '••••' + val.slice(-4) : translations[currentLang].notSet;
            apiModal.classList.remove('active');
        });

        const addAccountRow = document.getElementById('addAccountRow');
        const accountModal = document.getElementById('accountModal');
        const cancelAccBtn = document.getElementById('cancelAccBtn');
        const saveAccBtn = document.getElementById('saveAccBtn');
        const accountNameInput = document.getElementById('accountNameInput');

        addAccountRow.addEventListener('click', () => { accountModal.classList.add('active'); accountNameInput.value = ''; accountNameInput.focus(); });
        cancelAccBtn.addEventListener('click', () => accountModal.classList.remove('active'));
        saveAccBtn.addEventListener('click', () => {
            const accName = accountNameInput.value.trim();
            if (accName) { accounts.push({ name: accName, balance: 0, timeLeft: 3600 }); render(); }
            accountModal.classList.remove('active');
        });

        const languageSettingRow = document.getElementById('languageSettingRow');
        const langModal = document.getElementById('langModal');

        languageSettingRow.addEventListener('click', () => langModal.classList.add('active'));
        document.querySelectorAll('.lang-opt').forEach(opt => {
            opt.addEventListener('click', function() {
                const selectedCode = this.getAttribute('data-lang-code');
                setLanguage(selectedCode);
                langModal.classList.remove('active');
            });
        });

        const themeSettingRow = document.getElementById('themeSettingRow');
        const themeModal = document.getElementById('themeModal');
        const hueRange = document.getElementById('hueRange');
        const huePreviewText = document.getElementById('huePreviewText');
        const hslLabelText = document.getElementById('hslLabelText');
        const cancelThemeBtn = document.getElementById('cancelThemeBtn');
        const saveThemeBtn = document.getElementById('saveThemeBtn');
        const setBlackBtn = document.getElementById('setBlackBtn');
        const setWhiteBtn = document.getElementById('setWhiteBtn');

        themeSettingRow.addEventListener('click', () => themeModal.classList.add('active'));
        cancelThemeBtn.addEventListener('click', () => themeModal.classList.remove('active'));

        function applyTheme(h, s, l, label) {
            document.documentElement.style.setProperty('--accent-hue', h);
            document.documentElement.style.setProperty('--accent-sat', s);
            document.documentElement.style.setProperty('--accent-light', l);
            hslLabelText.textContent = label;
        }

        hueRange.addEventListener('input', (e) => {
            const hue = e.target.value;
            huePreviewText.textContent = `hsl(${hue}°, 50%, 25%)`;
            applyTheme(hue, '50%', '25%', `hsl(${hue}°, 50%, 25%)`);
        });

        setBlackBtn.addEventListener('click', () => {
            applyTheme(0, '0%', '0%', translations[currentLang].originalBlack);
            themeModal.classList.remove('active');
        });

        setWhiteBtn.addEventListener('click', () => {
            applyTheme(0, '0%', '100%', translations[currentLang].originalWhite);
            themeModal.classList.remove('active');
        });

        saveThemeBtn.addEventListener('click', () => {
            const hue = hueRange.value;
            applyTheme(hue, '50%', '25%', `hsl(${hue}°, 50%, 25%)`);
            themeModal.classList.remove('active');
        });
    </script>
</body>
