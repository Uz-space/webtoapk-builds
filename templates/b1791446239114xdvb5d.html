<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claimer Dashboard & Settings</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        .bg-mesh {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            background: 
                radial-gradient(circle at 15% 15%, rgba(35, 35, 35, 0.45) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(20, 20, 20, 0.45) 0%, transparent 45%);
            filter: blur(140px);
            pointer-events: none;
        }

        .app-root {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Sahifalar (Views) konteyneri */
        .view-section {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            flex-grow: 1;
            overflow: hidden;
        }

        .hidden {
            display: none !important;
        }

        /* Table/Card wrapper container */
        .table-wrapper {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 2px solid hsl(0, 0%, 50%);
            border-radius: 25px;
            padding: 14px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            overflow-y: auto;
            gap: 10px;
        }

        /* Header sarlavhalari — 25PX BALANDLIK */
        .grid-header, .settings-header {
            height: 25px;
            min-height: 25px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 2px;
            box-sizing: border-box;
        }

        .grid-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #aaaaaa;
            font-weight: 600;
        }

        .settings-header {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #ffffff;
            font-weight: 700;
        }

        /* Akkauntlar va Sozlamalar ro'yxati */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        /* BARCHA KARTALAR UCHUN 50PX BALANDLIK */
        .grid-row, .setting-row {
            width: 100%;
            height: 50px;
            min-height: 50px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid hsl(0, 0%, 50%);
            border-radius: 25px;
            padding: 0 16px;
            align-items: center;
            transition: background 0.2s ease, border-color 0.2s ease;
            box-sizing: border-box;
        }

        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }

        .grid-row:hover, .setting-row:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: hsl(0, 0%, 70%);
        }

        .col-1, .col-2, .col-3 {
            text-align: center;
            justify-self: center;
        }

        .account-name, .setting-title {
            font-weight: 500;
            color: #ffffff;
            font-size: 14px;
        }

        .balance-text {
            font-weight: 600;
            color: #ffffff;
        }

        .timer-text, .setting-value {
            color: #dddddd;
            font-variant-numeric: tabular-nums;
            font-size: 13px;
        }

        /* HSL TOGGLE COMPONENT */
        .custom-toggle {
            font-size: 13px;
            position: relative;
            display: inline-block;
            width: 3.5em;
            height: 2em;
            user-select: none;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .custom-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
            outline: none !important;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: hsl(0, 50%, 50%);
            border-radius: 2em;
            transition: background-color 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        .toggle-slider::before {
            content: "";
            position: absolute;
            height: 1.5em;
            width: 1.5em;
            border-radius: 50%;
            left: 0.25em;
            bottom: 0.25em;
            background-color: #ffffff;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
        }

        .custom-toggle input:checked + .toggle-slider {
            background-color: hsl(120, 50%, 50%);
        }

        .custom-toggle input:checked + .toggle-slider::before {
            transform: translateX(1.5em);
        }

        /* Modal Overlay & Card Styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #121212;
            border: 2px solid hsl(0, 0%, 50%);
            border-radius: 25px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #ffffff;
        }

        .modal-input {
            width: 100%;
            height: 46px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid hsl(0, 0%, 50%);
            border-radius: 15px;
            padding: 0 14px;
            color: #ffffff;
            font-size: 13px;
        }

        .modal-input:focus {
            border-color: #ffffff;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn {
            height: 38px;
            padding: 0 16px;
            border-radius: 19px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #cccccc;
        }

        .btn-save {
            background: #ffffff;
            color: #000000;
        }

        /* Glass Tab Bar Styles */
        .glass-tab-bar {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 12px; 
            padding: 4px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 5px;
            flex-shrink: 0;
        }

        .active-indicator {
            position: absolute;
            top: 4px;
            left: 0;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 1;
        }

        .tab-item {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 56px;
            height: 56px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            border-radius: 50%;
            transition: color 0.3s ease;
            cursor: pointer;
            z-index: 2;
            outline: none;
        }

        .tab-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            transition: transform 0.2s ease;
        }

        .tab-item:active svg {
            transform: scale(0.88);
        }

        .tab-item.active {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="bg-mesh"></div>

    <div class="app-root">
        
        <!-- 1. DASHBOARD VIEW -->
        <div class="view-section" id="dashboardView">
            <div class="table-wrapper">
                <div class="grid-header">
                    <div class="col-1">Account</div>
                    <div class="col-2">Balance</div>
                    <div class="col-3">Next Claim In</div>
                </div>
                <div class="item-list" id="accountsBody"></div>
            </div>
        </div>

        <!-- 2. SETTINGS VIEW -->
        <div class="view-section hidden" id="settingsView">
            <div class="table-wrapper">
                <div class="settings-header">Settings</div>
                <div class="item-list">
                    
                    <!-- 1. Notifications -->
                    <div class="setting-row">
                        <div class="setting-title">Notifications</div>
                        <label class="custom-toggle">
                            <input type="checkbox" id="my-toggle" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>

                    <!-- 2. Language -->
                    <div class="setting-row">
                        <div class="setting-title">Language</div>
                        <div class="setting-value">O'zbekcha</div>
                    </div>

                    <!-- 3. API Key -->
                    <div class="setting-row" id="apiSettingRow">
                        <div class="setting-title">API Key</div>
                        <div class="setting-value" id="apiValueDisplay">Not Set</div>
                    </div>

                    <!-- 4. Add Account -->
                    <div class="setting-row" id="addAccountRow">
                        <div class="setting-title">Add Account</div>
                        <div class="setting-value">+ Add</div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Glass Tab Bar -->
        <nav class="glass-tab-bar">
            <div class="active-indicator" id="indicator"></div>

            <a href="javascript:void(0)" class="tab-item active" data-target="dashboardView">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </a>
            
            <a href="javascript:void(0)" class="tab-item" data-target="dashboardView">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </a>
            
            <a href="javascript:void(0)" class="tab-item" data-target="dashboardView">
                <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1-1.5-1s-1.5.17-1.5 1v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
            </a>
            
            <a href="javascript:void(0)" class="tab-item" data-target="settingsView">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </a>
        </nav>
    </div>

    <!-- API Key Modal Overlay -->
    <div class="modal-overlay" id="apiModal">
        <div class="modal-card">
            <div class="modal-title">API Key Kiriting</div>
            <input type="password" class="modal-input" id="apiKeyInput" placeholder="sk-proj-xxxxxxxxxxxx">
            <div class="modal-actions">
                <button class="btn btn-cancel" id="cancelApiBtn">Bekor qilish</button>
                <button class="btn btn-save" id="saveApiBtn">Saqlash</button>
            </div>
        </div>
    </div>

    <!-- Add Account Modal Overlay -->
    <div class="modal-overlay" id="accountModal">
        <div class="modal-card">
            <div class="modal-title">Yangi Akkaunt Qo'shish</div>
            <input type="text" class="modal-input" id="accountNameInput" placeholder="Akkaunt nomi (masalan: user01)">
            <div class="modal-actions">
                <button class="btn btn-cancel" id="cancelAccBtn">Bekor qilish</button>
                <button class="btn btn-save" id="saveAccBtn">Qo'shish</button>
            </div>
        </div>
    </div>

    <script>
        /* Dashboard Logic */
        let accounts = [
            { name: "alphauzs", balance: 342.50, timeLeft: 3600 },
            { name: "trader", balance: 289.00, timeLeft: 1845 },
            { name: "user", balance: 156.20, timeLeft: 220 }
        ];

        let systemActive = true;

        function formatTime(seconds) {
            if (seconds <= 0) return "Ready Now";
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function render() {
            const container = document.getElementById('accountsBody');
            container.innerHTML = '';

            accounts.forEach((acc) => {
                const row = document.createElement('div');
                row.className = 'grid-row';
                row.innerHTML = `
                    <div class="col-1"><span class="account-name">${acc.name}</span></div>
                    <div class="col-2"><span class="balance-text">${acc.balance.toFixed(2)} TKN</span></div>
                    <div class="col-3"><span class="timer-text">${formatTime(acc.timeLeft)}</span></div>
                `;
                container.appendChild(row);
            });
        }

        setInterval(() => {
            if (!systemActive) return;
            let updated = false;
            accounts.forEach(acc => {
                if (acc.timeLeft > 0) {
                    acc.timeLeft--;
                    updated = true;
                }
            });
            if (updated) {
                render();
            }
        }, 1000);

        render();

        /* Tab Switcher Logic */
        const tabItems = document.querySelectorAll('.tab-item');
        const indicator = document.getElementById('indicator');
        const views = document.querySelectorAll('.view-section');

        function moveIndicator(targetElement) {
            if (targetElement && indicator) {
                indicator.style.transform = `translateX(${targetElement.offsetLeft}px)`;
            }
        }

        tabItems.forEach((item) => {
            item.addEventListener('click', function() {
                tabItems.forEach(tab => tab.classList.remove('active'));
                this.classList.add('active');

                moveIndicator(this);

                const targetViewId = this.getAttribute('data-target');
                views.forEach(view => {
                    if (view.id === targetViewId) {
                        view.classList.remove('hidden');
                    } else {
                        view.classList.add('hidden');
                    }
                });
            });
        });

        window.addEventListener('load', () => {
            const activeTab = document.querySelector('.tab-item.active');
            moveIndicator(activeTab);
        });

        window.addEventListener('resize', () => {
            const activeTab = document.querySelector('.tab-item.active');
            moveIndicator(activeTab);
        });

        /* API Modal Logic */
        const apiSettingRow = document.getElementById('apiSettingRow');
        const apiModal = document.getElementById('apiModal');
        const cancelApiBtn = document.getElementById('cancelApiBtn');
        const saveApiBtn = document.getElementById('saveApiBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const apiValueDisplay = document.getElementById('apiValueDisplay');

        apiSettingRow.addEventListener('click', () => {
            apiModal.classList.add('active');
            apiKeyInput.focus();
        });

        cancelApiBtn.addEventListener('click', () => {
            apiModal.classList.remove('active');
        });

        saveApiBtn.addEventListener('click', () => {
            const keyVal = apiKeyInput.value.trim();
            if (keyVal.length > 0) {
                apiValueDisplay.textContent = '••••' + keyVal.slice(-4);
            } else {
                apiValueDisplay.textContent = 'Not Set';
            }
            apiModal.classList.remove('active');
        });

        /* Add Account Modal Logic */
        const addAccountRow = document.getElementById('addAccountRow');
        const accountModal = document.getElementById('accountModal');
        const cancelAccBtn = document.getElementById('cancelAccBtn');
        const saveAccBtn = document.getElementById('saveAccBtn');
        const accountNameInput = document.getElementById('accountNameInput');

        addAccountRow.addEventListener('click', () => {
            accountModal.classList.add('active');
            accountNameInput.value = '';
            accountNameInput.focus();
        });

        cancelAccBtn.addEventListener('click', () => {
            accountModal.classList.remove('active');
        });

        saveAccBtn.addEventListener('click', () => {
            const accName = accountNameInput.value.trim();
            if (accName.length > 0) {
                accounts.push({ name: accName, balance: 0.00, timeLeft: 3600 });
                render();
            }
            accountModal.classList.remove('active');
        });

        /* Toggle Event Listener */
        const myToggle = document.getElementById('my-toggle');
        if (myToggle) {
            myToggle.addEventListener('change', function() {
                if (this.checked) {
                    console.log("Holat: ON (Yashil)");
                } else {
                    console.log("Holat: OFF (Qizil)");
                }
            });
        }
    </script>
</body>
</html>
